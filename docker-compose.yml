# ============================================================================
#  Phytoemagry — despliegue con Docker Compose
#
#  En el servidor:
#    1) git clone https://github.com/JUNIORPRUEVA/phytoemagrywed.git
#    2) cd phytoemagrywed
#    3) docker compose up -d --build
#    4) abre http://IP-del-servidor:8080
#
#  Actualizar a la última versión:
#    git pull && docker compose up -d --build
#
#  Valores: los de abajo son los que se usan si no defines otra cosa. Puedes
#  sobrescribirlos sin tocar este archivo creando un `.env` junto al compose
#  (mismas claves). Son datos PÚBLICOS: van dentro del HTML/JS.
#  Guía completa: docs/DESPLIEGUE.md
# ============================================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Número que recibe los pedidos y las consultas de WhatsApp.
        PHYTO_WHATSAPP_NUMBER: "${PHYTO_WHATSAPP_NUMBER:-18297853794}"
        # Dominio final (sin barra al final): activa canonical, sitemap y la
        # vista previa con imagen al compartir el enlace. Vacío = desactivado.
        SEO_SITE_URL: "${SEO_SITE_URL:-}"
        # Endpoint del CRM. `/api/crm` (por defecto) es el API que ya trae esta
        # imagen: guarda los contactos y los pedidos en la base de datos del
        # volumen `/data`. Para usar otro CRM, pon aquí su URL completa.
        PHYTO_CRM_ENDPOINT: "${PHYTO_CRM_ENDPOINT:-/api/crm}"
        # Meta Pixel (vacío = no se carga ningún script de Meta).
        PHYTO_META_PIXEL_ID: "${PHYTO_META_PIXEL_ID:-}"
        # Email de contacto visible (vacío = no se muestra).
        CONTACT_EMAIL: "${CONTACT_EMAIL:-}"
        APP_ENV: "${APP_ENV:-production}"

    image: phytoemagry:latest
    container_name: phytoemagry
    restart: unless-stopped

    # Clave para LEER los datos (`/panel?token=...` y la descarga en CSV).
    # Cámbiala por una tuya, larga y solo tuya, en el archivo `.env`.
    # Sin ella, los datos se siguen guardando pero no se pueden consultar.
    environment:
      PHYTO_CRM_TOKEN: "${PHYTO_CRM_TOKEN:-}"
      # Base de datos PostgreSQL (recomendado). Si la dejas vacía, los datos se
      # guardan en SQLite dentro del contenedor (volumen `phytoemagry-data`).
      PHYTO_CRM_DATABASE_URL: "${PHYTO_CRM_DATABASE_URL:-}"

    # Puerto del servidor : puerto del contenedor.
    # Cámbialo con WEB_PORT en el `.env` si el 8080 está ocupado.
    ports:
      - "${WEB_PORT:-8080}:80"

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

    # Aquí vive la base de datos cuando NO hay PostgreSQL configurado. Es el
    # volumen el que hace que los datos sobrevivan a `docker compose up -d --build`.
    # Copia de seguridad:  docker run --rm -v phytoemagry-data:/data -v "$PWD":/backup \
    #                        alpine tar czf /backup/phytoemagry-datos.tar.gz -C /data .
    volumes:
      - phytoemagry-data:/data

    # Sin privilegios extra.
    security_opt:
      - no-new-privileges:true

volumes:
  phytoemagry-data:
