<!doctype html>
<html lang="es-DO">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8fa" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Tu número de teléfono · FULLTECH Store</title>
    <link rel="icon" href="/store/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/store/store.css?v=2" />
    <link rel="stylesheet" href="/store/premium.css?v=2" />
    <link rel="stylesheet" href="/store/verify/verify.css?v=2" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="icon-button" href="/store/" aria-label="Volver a la tienda">‹</a>
        <a class="wordmark" href="/store/" aria-label="FULLTECH Store, inicio">
          <span class="brand-mark">F</span><span>FULL<span>TECH</span><small>STORE</small></span>
        </a>
        <span class="icon-button" aria-hidden="true"></span>
      </header>

      <main id="main" tabindex="-1">
        <div class="verify-loading" id="verify-loading">
          <span class="verify-spinner" aria-hidden="true"></span>
          <p>Comprobando tu cuenta…</p>
        </div>
        <section class="verify-panel" id="verify-panel" hidden aria-live="polite"></section>
      </main>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/store/verify/verify.js?v=1"></script>
  </body>
</html>
