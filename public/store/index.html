<!doctype html>
<html lang="es-DO">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8fa" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Explora el catálogo de FULLTECH Store." />
    <link rel="manifest" href="/store/manifest.webmanifest" />
    <link rel="icon" href="/store/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/store/icon-192.png" />
    <link rel="stylesheet" href="/store/store.css?v=7" />
    <link rel="stylesheet" href="/store/premium.css?v=5" />
    <link rel="stylesheet" href="/store/design-system.css?v=10" />
    <link rel="stylesheet" href="/store/product-gallery.css?v=5" />    <link rel="stylesheet" href="/store/storefront.css?v=3" />    <link rel="stylesheet" href="/store/custom-icons.css?v=1" />
    <link rel="stylesheet" href="/store/presentation.css?v=2" />
    <link rel="stylesheet" href="/store/floating-cart.css?v=3" />
    <link rel="stylesheet" href="/store/discovery.css?v=21" />
    <title>FULLTECH Store</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="ft-header">
        <div class="ft-header__row">
          <button class="ft-iconbtn" id="menu-button" aria-label="Abrir menú" aria-expanded="false" aria-controls="drawer">
            <svg data-msr="menu" data-msr-size="22" aria-hidden="true"></svg>
          </button>
          <a class="ft-wordmark" href="/store/" aria-label="FULLTECH Store, inicio">
            <picture>
              <source type="image/webp" srcset="/store/assets/branding/fulltech-store-header-transparent-144.webp 1x, /store/assets/branding/fulltech-store-header-transparent-288.webp 2x, /store/assets/branding/fulltech-store-header-transparent-432.webp 3x" />
              <img class="ft-logo" src="/store/assets/branding/fulltech-store-header-transparent-144.png" srcset="/store/assets/branding/fulltech-store-header-transparent-288.png 2x, /store/assets/branding/fulltech-store-header-transparent-432.png 3x" width="2355" height="528" alt="FULLTECH STORE" fetchpriority="high" />
            </picture>
          </a>
          <nav class="ft-header__nav" aria-label="Información">
            <a href="/store/#/nosotros" data-route="nosotros">Nosotros</a>
          </nav>
          <div class="ft-header__actions">
            <button class="ft-iconbtn ft-install" id="install-app" type="button" aria-label="Instalar FULLTECH Store" title="Instalar FULLTECH Store">
              <span class="ft-install-icon" style="--install-icon-url:url('/store/assets/icons/custom/instalar-en-pc.png')" aria-hidden="true"></span><span class="ft-install-label">Instalar</span>
            </button>
            <a class="ft-iconbtn ft-profile" href="/store/#/account/register" aria-label="Crear mi cuenta" title="Crear mi cuenta"><svg data-msr="account" data-msr-size="22" aria-hidden="true"></svg></a>
            <a class="ft-iconbtn cart-shortcut" href="/store/#/cart" data-route="cart" aria-label="Carrito" title="Carrito" hidden>
              <svg data-msr="cart" data-msr-size="22" aria-hidden="true"></svg>
              <span class="ft-cart-badge" data-cart-badge hidden></span>
            </a>
          </div>
        </div>
      </header>

      <main id="main" tabindex="-1" aria-live="polite"></main>

      <nav class="ft-nav" id="bottom-nav" aria-label="Navegación principal">
        <a href="/store/" class="ft-nav__item" data-route="home" aria-current="page">
          <svg data-msr="home" data-msr-size="22" data-msr-variant="filled" aria-hidden="true"></svg>
          <span>Inicio</span>
        </a>
        <a href="/store/#/catalog" class="ft-nav__item" data-route="catalog">
          <svg data-msr="categories" data-msr-size="22" aria-hidden="true"></svg>
          <span>Categorías</span>
        </a>
        <a href="/store/#/cart" class="ft-nav__item" data-route="cart">
          <svg data-msr="cart" data-msr-size="22" aria-hidden="true"></svg>
          <span>Carrito</span>
          <span class="ft-cart-badge ft-cart-badge--nav" data-cart-badge hidden></span>
        </a>
        <a href="/store/#/request" class="ft-nav__item" data-route="request" aria-label="Lo conseguimos por ti">
          <svg data-msr="search" data-msr-size="22" aria-hidden="true"></svg>
          <span>Lo conseguimos</span>
        </a>
      </nav>
      <a class="ft-signup-prompt" id="signup-prompt" href="/store/#/account/register" aria-live="polite" hidden>Regístrate con Google</a>
    </div>

    <div class="drawer-scrim" id="drawer-scrim" hidden></div>
    <aside class="drawer" id="drawer" aria-label="Menú FULLTECH" aria-hidden="true" inert>
      <div class="drawer-head"><a class="ft-drawer-logo" href="/store/" aria-label="FULLTECH Store, inicio"><picture><source type="image/webp" srcset="/store/assets/branding/fulltech-store-horizontal-240.webp 1x, /store/assets/branding/fulltech-store-horizontal-480.webp 2x, /store/assets/branding/fulltech-store-horizontal-720.webp 3x" /><img src="/store/assets/branding/fulltech-store-horizontal-240.png" srcset="/store/assets/branding/fulltech-store-horizontal-480.png 2x, /store/assets/branding/fulltech-store-horizontal-720.png 3x" width="240" height="84" alt="FULLTECH STORE" /></picture></a><button class="icon-button" id="close-drawer" aria-label="Cerrar menú"><span class="ft-custom-icon" data-custom-icon="close" style="--icon-url:url('/store/assets/icons/custom/close.png');--icon-size:18px" aria-hidden="true"></span></button></div>
      <p class="drawer-label">EXPLORA</p>
      <a href="/store/" data-route="home">Inicio</a>
      <a href="/store/#/catalog" data-route="catalog">Catálogo</a>
      <a href="/store/#/catalog?kind=service" data-route="catalog?kind=service">Servicios</a>
      <a href="/store/#/request" data-route="request">Lo conseguimos por ti</a>
      <a href="/store/#/nosotros" data-route="nosotros">Nosotros</a>
      <div class="drawer-divider"></div>
      <p class="drawer-label">TU ESPACIO</p>
      <a href="/store/#/favorites" data-route="favorites">♡ Mis favoritos</a>
      <a href="/store/#/orders" data-route="orders">Mis pedidos</a>
      <a href="/store/#/account" data-route="account">Mi cuenta</a>
      <div class="drawer-bottom"><span class="status-dot"></span> Tu tienda FULLTECH</div>
    </aside>
    <div id="cart-feedback-status" class="ft-action-status" role="status" aria-live="polite" aria-atomic="true"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/store/store.js?v=48"></script>    <script type="module" src="/store/google-signin.js?v=2"></script>  </body>
</html>
