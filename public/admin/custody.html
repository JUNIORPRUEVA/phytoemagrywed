<!doctype html>
<html lang="es" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Custodia y rendiciones · FULLTECH</title>
<script>
/*
 * EL MISMO TEMA QUE EL PANEL, SIN PARPADEAR.
 *
 * Esta pantalla es una página aparte, así que no hereda nada del armazón: aquí
 * se lee la preferencia que guardó el panel (`pe_tema`) y se pinta claro u oscuro
 * ANTES de mostrar nada. Con «como el teléfono» se sigue al sistema, y si la
 * persona cambia el tema en otra pestaña, esta se entera.
 */
(function () {
  var KEY = 'pe_tema';
  var root = document.documentElement;
  var media = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function pintar(pref) {
    var elegido = pref === 'dark' || pref === 'light' ? pref : 'auto';
    var oscuro = elegido === 'dark' || (elegido === 'auto' && !!media && media.matches);
    root.dataset.tema = elegido;
    root.dataset.theme = oscuro ? 'dark' : 'light';
    root.style.colorScheme = oscuro ? 'dark' : 'light';
  }
  var guardado = 'auto';
  try { guardado = localStorage.getItem(KEY) || 'auto'; } catch (e) { /* sin Storage se usa el sistema */ }
  pintar(guardado);
  if (media && media.addEventListener) {
    media.addEventListener('change', function () {
      if ((root.dataset.tema || 'auto') === 'auto') pintar('auto');
    });
  }
  window.addEventListener('storage', function (event) {
    if (event.key === KEY) pintar(event.newValue || 'auto');
  });
})();
</script>
<style>
/*
 * CUSTODIA Y RENDICIONES — misma piel que el resto del panel.
 *
 * Los colores salen de variables con su versión de noche (las mismas familias
 * que el CRM: fondo de página, tarjeta, línea fina, marca). Ningún color va
 * escrito a mano en una regla: si algo se ve mal de noche se arregla aquí.
 */
:root{
  color-scheme:light;
  --page:#f4f7fd;--card:#ffffff;--bar-bg:rgba(255,255,255,.94);
  --line:#dfe7f4;--hair:rgba(23,43,77,.08);
  --ink:#10222d;--ink-2:#53647d;--muted:#64748b;
  --brand:#145bd7;--on-brand:#ffffff;--brand-soft:#e5efff;--chip:#edf3fc;
  --ok:#15803d;--ok-bg:#f0fdf4;--ok-line:#bbf7d0;
  --warn:#b45309;--warn-bg:#fffbeb;--warn-line:#fde68a;
  --shadow:0 10px 26px rgba(20,60,120,.10)
}
:root[data-theme='dark']{
  color-scheme:dark;
  --page:#0b1424;--card:#152339;--bar-bg:rgba(17,29,48,.94);
  --line:#30425e;--hair:rgba(255,255,255,.09);
  --ink:#eaf1fd;--ink-2:#cfdbed;--muted:#afc0d9;
  --brand:#8dbbff;--on-brand:#0b2142;--brand-soft:#203b60;--chip:#1e304a;
  --ok:#54dda2;--ok-bg:#12332a;--ok-line:#1f5a49;
  --warn:#f3c778;--warn-bg:#3a2f16;--warn-line:#5a4720;
  --shadow:0 12px 30px rgba(0,0,0,.55)
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--page);font-size:13.5px;line-height:1.35;-webkit-tap-highlight-color:transparent}
main{max-width:1180px;margin:0 auto;padding:0 14px 32px}
code{background:var(--chip);color:var(--ink);padding:1px 5px;border-radius:6px;font-size:11.5px}

/* --- Barra de arriba: el volver redondo del panel y el título al lado --- */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 -14px 12px;padding:8px 14px;border-bottom:1px solid var(--hair);background:var(--bar-bg);backdrop-filter:blur(14px)}
.bar h1{font-size:16px;margin:0;font-weight:760;letter-spacing:.01em}
.bar .sp{flex:1}
.bar a.back{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;width:40px;height:40px;padding:0;border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--ink);text-decoration:none;cursor:pointer}
.bar a.back:hover,.bar a.back:focus-visible{background:var(--chip);color:var(--brand);border-color:var(--brand)}
.bar a.back svg{display:block;width:20px;height:20px}

/* --- Cifras de arriba --- */
.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:9px 11px;min-height:56px}
.card small{display:block;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:750}
.card b{display:block;margin-top:3px;font-size:15.5px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.warn{border-color:var(--warn-line);background:var(--warn-bg)}
.card.warn small,.card.warn b{color:var(--warn)}

/* --- Buscador y filtro --- */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.toolbar input,.toolbar select{min-height:38px;padding:0 11px;border:1px solid var(--line);border-radius:11px;font:inherit;background:var(--card);color:var(--ink)}
.toolbar input::placeholder{color:var(--muted)}
.toolbar input:focus-visible,.toolbar select:focus-visible,#remittance input:focus-visible,#login input:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.toolbar input[type=search]{min-width:190px}

button{min-height:36px;padding:0 13px;border-radius:11px;border:1px solid var(--brand);background:var(--brand);color:var(--on-brand);font:inherit;font-weight:700;cursor:pointer}
button.ghost{background:transparent;color:var(--brand);border-color:var(--line)}
button.ghost:hover{background:var(--chip)}
button[disabled]{opacity:.55;cursor:not-allowed}

/* --- Tabla de repartidores --- */
.wrap{background:var(--card);border:1px solid var(--hair);border-radius:14px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--hair);color:var(--ink)}
th{font-size:9.8px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:750;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--chip)}
tbody tr:last-child td{border-bottom:0}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.act{text-align:right}
.who b{display:block;font-size:13px}
.who span{font-size:11px;color:var(--muted)}

/* --- Estado: los mismos colores de aviso del panel, también de noche --- */
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:750;border:1px solid}
.tag.ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-line)}
.tag.warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-line)}
.tag.none{color:var(--muted);background:transparent;border-color:var(--line)}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:12.5px}

/* --- Incidencias --- */
#incidents{margin-top:14px}
#incidents h2{margin:0 0 8px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
#incidents .item{border:1px solid var(--hair);border-left:3px solid var(--warn-line);background:var(--card);border-radius:10px;padding:9px 11px;margin-bottom:6px;font-size:12.5px}
#incidents .item b{font-size:12.5px}
#incidents .item p{margin:3px 0 0;color:var(--muted);font-size:11.8px}

/* --- Acceso (solo si la sesión no vale) --- */
#login{display:grid;gap:10px;max-width:340px;margin:10px 0 0;padding:14px;border:1px solid var(--hair);border-radius:14px;background:var(--card)}
#login[hidden]{display:none}
#login label{display:grid;gap:5px;font-size:12px;font-weight:700;color:var(--ink-2)}
#login input{min-height:40px;padding:0 11px;border:1px solid var(--line);border-radius:11px;background:var(--page);color:var(--ink);font:inherit}

/* --- Cajón del repartidor --- */
#drawer{position:fixed;inset:0;z-index:30;display:none;justify-content:flex-end;background:rgba(7,20,36,.45)}
#drawer[open]{display:flex}
#drawer .sheet{width:min(400px,100%);height:100%;display:flex;flex-direction:column;background:var(--card);color:var(--ink);border-left:1px solid var(--line);box-shadow:var(--shadow)}
#drawer header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--hair)}
#drawer header h2{margin:0;flex:1;font-size:15px;font-weight:760}
#drawer .body{flex:1;padding:12px 14px;overflow:auto;overscroll-behavior:contain}
#drawer .row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--hair);font-size:12.8px}
#drawer .row span{color:var(--ink-2);font-size:12.2px}
#drawer .row b{font-variant-numeric:tabular-nums}
#drawer h3{margin:14px 0 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
#remittance{display:grid;gap:8px}
#remittance input{min-height:38px;padding:0 11px;border:1px solid var(--line);border-radius:11px;background:var(--page);color:var(--ink);font:inherit}
.hint{margin:0;font-size:11.5px;color:var(--muted)}
#status{margin:0 0 10px}

@media(max-width:900px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:600px){main{padding:0 10px 28px}.bar{margin:0 -10px 10px;padding:6px 10px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}th.hide,td.hide{display:none}.toolbar input[type=search]{flex:1;min-width:0}}
</style></head>
<body><main>
<div class="bar">
  <a class="back" href="/admin/" aria-label="Volver al CRM" title="Volver al CRM">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 12H4.7"/><path d="M11 5.3 4.3 12l6.7 6.7"/></svg>
  </a>
  <h1>Custodia y rendiciones</h1>
  <span class="sp"></span>
  <button id="refresh" class="ghost" type="button">Actualizar</button>
</div>
<p class="hint" id="status" role="status">Comprobando sesión…</p>

<form id="login" hidden>
  <label>Usuario<input name="username" autocomplete="username" required></label>
  <label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label>
  <button>Entrar</button>
</form>

<div id="workspace" hidden>
  <div class="cards" id="cards"></div>

  <div class="toolbar">
    <input id="search" type="search" placeholder="Buscar repartidor…" aria-label="Buscar repartidor">
    <select id="filter" aria-label="Filtrar">
      <option value="all">Todos</option>
      <option value="pending">Con saldo</option>
      <option value="settled">Conciliados</option>
      <option value="risk">Con diferencia</option>
    </select>
    <span class="hint" id="updated"></span>
  </div>

  <div class="wrap">
    <table>
      <thead><tr>
        <th>Repartidor</th><th class="hide">Pedidos</th><th class="num">Efectivo</th><th class="num hide">Rendido</th><th class="num">Pendiente</th><th>Estado</th><th class="act"></th>
      </tr></thead>
      <tbody id="couriers"><tr><td colspan="7" class="empty">Cargando…</td></tr></tbody>
    </table>
  </div>

  <div id="incidents"></div>
</div>

<div id="drawer" role="dialog" aria-modal="true" aria-label="Detalle del repartidor">
  <div class="sheet">
    <header><h2 id="d-name">Repartidor</h2><button id="d-close" class="ghost" type="button">Cerrar</button></header>
    <div class="body">
      <div id="d-totals"></div>
      <h3>Registrar rendición</h3>
      <form id="remittance">
        <input name="amount" inputmode="decimal" placeholder="Monto recibido (RD$)" required>
        <input name="note" maxlength="120" placeholder="Referencia (opcional)">
        <p class="hint" id="r-preview">Saldo pendiente: RD$0.00 · Nuevo saldo: RD$0.00</p>
        <button type="submit">Confirmar rendición</button>
        <p class="hint" id="r-result" role="status"></p>
      </form>
      <h3>Movimientos</h3>
      <div id="d-movements"></div>
    </div>
  </div>
</div>
<script type="module" src="/admin/custody.js?v=3"></script>
</main></body></html>
