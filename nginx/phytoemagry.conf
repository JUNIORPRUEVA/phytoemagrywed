# ============================================================================
#  Nginx — landing Phytoemagry (VARIANTE SIN DOCKER)
#
#  Si despliegas con Docker, NO uses este archivo: el contenedor ya trae su
#  propia configuración escrita dentro del `Dockerfile` (etapa 2). Este archivo
#  es el equivalente para un nginx instalado en el servidor y sirve, además,
#  como referencia de las directivas.
#
#  Uso en un servidor con nginx del sistema:
#    1. npm run build  → genera dist/
#    2. copiar dist/ a /var/www/phytoemagry
#    3. ajustar `server_name` con tu dominio e incluir este archivo
#    4. (opcional) arrancar la base de datos de la web:
#       PHYTO_CRM_TOKEN=tu-clave node server/crm-server.mjs
#
#  Nota CSP: el valor recomendado se genera en `dist/csp-header.txt` en cada
#  build (incluye los hashes de los scripts inline). Descomenta la línea y pégalo.
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    # Cambia por tu dominio (con Docker esto lo gestiona el proxy de delante).
    server_name phytoemagry.example www.phytoemagry.example;

    root /var/www/phytoemagry;
    index index.html;

    charset utf-8;

    # ---------------------------------------------------------------- seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;
    # HSTS solo cuando el HTTPS ya funciona delante (proxy/certificado):
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Pega aquí el valor de dist/csp-header.txt:
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-...'; ..." always;

    # --------------------------------------------------------------- compresión
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # brotli on;  # si el módulo está compilado
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml;

    # -------------------------------------------------- API del CRM (Node)
    # Opcional: solo si además de nginx arrancas la base de datos de la web
    # (server/crm-server.mjs). Nginx le pasa `/api/` y `/panel` a Node.
    # Arranque: PHYTO_CRM_TOKEN=tu-clave node server/crm-server.mjs
    # `^~` evita que lo capturen las reglas de abajo (map/md/json).
    # Canales SSE: sin búfer y sin comprimir.
    location = /api/admin/events {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
    location = /api/admin/whatsapp/events {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
    location = /api/admin/delivery-tracking/events {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SIN BÚFER: por aquí viaja el canal en vivo del chat y del reparto (SSE).
        proxy_buffering off;
        proxy_cache off;
        # Una conexión en vivo dura lo que dure la pestaña abierta.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        # JSON comprimido: el panel manda paquetes grandes.
        gzip on;
        gzip_proxied any;
        gzip_types application/json;
        gzip_min_length 1024;
        gzip_comp_level 6;
        # SUBIDAS DEL PANEL (imagen, nota de voz, PDF): el archivo viaja como
        # CUERPO CRUDO y una nota de voz de 30 s ya pesa ~0,5 MB. Con el tope
        # global de 256k, nginx respondía 413 ANTES de llegar al servidor (se
        # grababa y se escuchaba, pero «Enviar» no hacía nada). Aquí se deja
        # pasar el máximo que acepta el servidor (PDF 100 MB, audio 16 MB,
        # imagen 5 MB), que además valida cada uno.
        client_max_body_size 110m;
    }

    # --------------------------------------------- app del panel (PWA)
    # El negocio la instala en el móvil. Los archivos son estáticos, pero nunca
    # se cachean: publicar tiene que verse al instante.
    #
    # `/panel` es el enlace antiguo (llevaba la clave en la URL): se redirige a
    # `/admin/`, que pide la clave una vez y guarda la sesión.
    # OJO: un solo `location = /panel` por servidor; dos iguales hacen que nginx
    # aborte con `duplicate location` y el contenedor no arranque.
    location = /panel { return 302 /admin/; }

    # PWA de clientes: alcance e identidad separados de /admin/.
    location = /store/manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /store/sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/store/" always;
        try_files $uri =404;
    }

    # SEO de la tienda: la página de cada artículo publicado se renderiza en el
    # servidor del CRM (el catálogo es la fuente de verdad), igual que el
    # sitemap y el robots.txt. El resto de `/store/` sigue siendo estático.
    # OJO: el orden de estos bloques debe coincidir con el Dockerfile
    # (tests/render.test.js compara las dos copias directiva por directiva).
    location = /store/robots.txt {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /store/sitemap.xml {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /store/p/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Portada de la tienda: el servidor del CRM devuelve el MISMO HTML de la PWA
    # con canonical, Open Graph y enlaces rastreables inyectados. Si el servicio
    # no responde, nginx sirve el archivo estático como red de seguridad.
    # Sin `add_header` aquí: hereda las cabeceras de seguridad del servidor.
    location = /store/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        error_page 502 503 504 = @store_static_home;
    }
    location = /store {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
    location @store_static_home {
        internal;
        try_files /store/index.html =404;
    }

    location ^~ /admin/ {
        try_files $uri $uri/ /admin/index.html;
        expires -1;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Service-Worker-Allowed "/admin/" always;
            add_header Permissions-Policy "geolocation=(self), microphone=(self), camera=(self)" always;
    }

    # --------------------------------------------------------------------- rutas
    # Páginas legales: /privacidad y /terminos (sin .html)
    location = /privacidad { try_files /privacidad.html =404; }
    location = /terminos   { try_files /terminos.html   =404; }

    # Assets con hash de contenido: caché inmutable de 1 año
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Imágenes y fuentes sin hash: caché de 30 días
    location ~* \.(?:png|jpe?g|webp|avif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
        try_files $uri =404;
    }

    # El HTML y los archivos de SEO nunca se cachean (publicar = ver el cambio ya)
    location ~* \.(?:html|xml|txt)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Endurecimiento básico
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(?:map|md|json)$ { deny all; }  # no publicar fuentes ni docs
}
