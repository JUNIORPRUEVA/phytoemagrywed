# ============================================================================
#  Nginx — landing Phytoemagry (contenedor Docker)
#
#  Esta configuración está pensada para IR DENTRO de la imagen: el sitio queda en
#  `/usr/share/nginx/html` (donde el Dockerfile copia `dist/`).
#
#  Uso con Docker (lo normal):
#    docker build -t phytoemagry .
#    docker run -d -p 8080:80 phytoemagry
#
#  Uso en un servidor con nginx del sistema (sin Docker): cambia estas dos líneas
#    root /usr/share/nginx/html;      →  root /var/www/phytoemagry;
#    server_name _;                   →  server_name tudominio.com www.tudominio.com;
#  y copia `dist/` a esa carpeta.
#
#  Nota CSP: el valor recomendado se genera en `dist/csp-header.txt` en cada
#  build (incluye los hashes de los scripts inline). Descomenta la línea y pégalo.
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    # `_` = acepta cualquier Host: el dominio real lo gestiona el proxy de delante
    # (o el reverse proxy del servidor con certificado HTTPS).
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # ---------------------------------------------------------------- seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # HSTS solo cuando el HTTPS ya funciona delante (proxy/certificado):
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Pega aquí el valor de dist/csp-header.txt:
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-...'; ..." always;

    # --------------------------------------------------------------- compresión
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # brotli on;  # si el módulo está compilado
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml;

    # --------------------------------------------------------------------- rutas
    # Páginas legales: /privacidad y /terminos (sin .html)
    location = /privacidad { try_files /privacidad.html =404; }
    location = /terminos   { try_files /terminos.html   =404; }

    # Assets con hash de contenido: caché inmutable de 1 año
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Imágenes y fuentes sin hash: caché de 30 días
    location ~* \.(?:png|jpe?g|webp|avif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
        try_files $uri =404;
    }

    # El HTML y los archivos de SEO nunca se cachean (publicar = ver el cambio ya)
    location ~* \.(?:html|xml|txt)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Endurecimiento básico
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(?:map|md|json)$ { deny all; }  # no publicar fuentes ni docs
}
